<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Fab Optimization</title>
<style>
:root{--bg:#f7f8fa;--fg:#111827;--mut:#6b7280;--line:#e5e7eb;--card:#fff;--acc:#1d4ed8}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 30px;width:min(420px,92vw);
  box-shadow:0 10px 30px rgba(0,0,0,.06)}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px}
input{width:100%;box-sizing:border-box;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
input.code{font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.35em;text-transform:uppercase;text-align:center}
button{margin-top:10px;width:100%;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--acc);
  background:var(--acc);color:#fff;cursor:pointer}button.alt{background:#fff;color:var(--acc)}
button:disabled{opacity:.6;cursor:default}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:18px 0 4px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.msg{margin-top:12px;font-size:13px;min-height:1.4em}.msg.err{color:#b91c1c}.msg.ok{color:#15803d}
.foot{margin-top:18px;font-size:12px;color:var(--mut)}
</style></head><body>
<form class="card" id="f" autocomplete="off">
  <h1>Fab Optimization</h1>
  <p class="sub">Live dispatch dashboard for a simulated 300 mm fab.</p>

  <div id="emailBlock">
    <label for="email">Your email</label>
    <input id="email" type="email" placeholder="you@company.com" inputmode="email">
    <button type="button" id="sendBtn">Email me an access code</button>
    <div class="or">or</div>
  </div>

  <label for="code">Access code</label>
  <input id="code" class="code" maxlength="7" placeholder="••••••" autocapitalize="characters" spellcheck="false">
  <button type="submit" id="codeBtn" class="alt">Enter</button>

  <div class="msg" id="msg"></div>
  <div class="foot">Codes are six characters. If you were given one, it works for anyone you share it with; use is recorded.</div>
</form>
<script>
const $=id=>document.getElementById(id), msg=(t,c)=>{$('msg').textContent=t;$('msg').className='msg '+(c||'')}
const next=new URLSearchParams(location.search).get('next')||'/'
const err=new URLSearchParams(location.search).get('error'); if(err) msg(err,'err')
fetch('/auth/me').then(r=>r.json()).then(m=>{
  if(m.authenticated){location.replace(next);return}
  if(!m.email_login){$('emailBlock').hidden=true}
}).catch(()=>{})
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('error '+r.status));return j}
$('f').addEventListener('submit',async e=>{e.preventDefault();const code=$('code').value.trim();if(!code)return
  $('codeBtn').disabled=true;msg('checking…')
  try{await post('/auth/code',{code});msg('welcome','ok');location.replace(next)}
  catch(x){msg(x.message,'err');$('codeBtn').disabled=false}})
$('sendBtn').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){msg('enter your email first','err');return}
  $('sendBtn').disabled=true;msg('sending…')
  try{const j=await post('/auth/email',{email});msg('sent to '+j.sent_to+' — open the link or type the code above','ok')}
  catch(x){msg(x.message,'err')}finally{$('sendBtn').disabled=false}})
$('code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)})
</script></body></html>
