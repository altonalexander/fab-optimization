# Dev-only override: reach Kafka from the host.
#
# WHY THIS IS A SEPARATE FILE, AND WHY IT NEEDS A WHOLE NETWORK
#
# data-net is declared `internal: true`. That is not incidental -- it is the
# zone model doing its job: zone 2 has no egress and no ingress. Docker
# enforces it by disabling external connectivity on the network entirely,
# which includes port publishing. A `ports:` entry on an internal-only service
# is accepted into HostConfig.PortBindings and then silently never
# materialises: NetworkSettings.Ports stays empty, `docker port` prints
# nothing, and the host gets connection refused with no error anywhere. That
# silence cost an hour of misdiagnosis; it is the network, not compose.
#
# So reaching the broker from the host means giving it a second, non-internal
# network. That is a real hole in the isolation, which is why it lives here
# and never in the base file. `make verify` will flag the published port while
# this override is in use, and it is right to.
#
# In production the MES producer runs INSIDE the data zone -- that is what the
# (now removed) mes-producer service was for -- so none of this exists there.
#
#   cd dispatch/infra
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#       --profile data up -d kafka kafka-init
#
#   baselines/pyscfabsim/.venv/bin/python3 bench/tools/sim_feed.py \
#       --kafka localhost:29092 --days 3 --speed 400
#
#   KAFKA_BROKERS=localhost:29092 make api
#
# A second listener rather than a changed one: services inside the zones keep
# resolving kafka:9092 exactly as before, so the in-cluster path is untouched.

networks:
  devhost-net:
    name: fab-devhost
    driver: bridge          # deliberately NOT internal -- that is the point

services:
  kafka:
    networks: [data-net, devhost-net]
    ports:
      - "29092:29092"
    environment:
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
