server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- access gate ------------------------------------------------------
    # Every request below asks the API whether the browser's session cookie
    # is valid (auth_request). No cookie: pages go to /login, API calls get
    # 401. The gate is codes + magic links, see api/auth.py. Only /login, the
    # auth endpoints themselves and /health are open.
    auth_request /auth/check;
    error_page 401 = @login;
    location @login {
        # API and stream callers get the 401; humans get the login page.
        if ($request_uri ~ ^/(api|docs|redoc|openapi)) { return 401; }
        return 302 /login?next=$request_uri;
    }
    location = /auth/check {
        internal;
        auth_request off;
        proxy_pass http://api:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location /auth/ {
        auth_request off;
        limit_except GET HEAD OPTIONS POST { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /login { auth_request off; try_files /login.html =404; }
    location = /admin { try_files /admin.html =404; }

    location / { try_files $uri $uri/ /index.html; }

    # Proxy to the API. The UI never reaches zone 2 directly.
    # No trailing slash on proxy_pass: the Flask routes are themselves
    # /api/..., so the prefix must reach the API intact. With a trailing
    # slash nginx stripped it and every endpoint but /health returned 404.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
    }

    # Liveness probe: the only unprefixed route the API serves. Stays open so
    # the tunnel / uptime monitor can poll it without credentials.
    location = /health {
        auth_request off;
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://api:8000;
    }

    # Scenario endpoints are the ONLY POSTs allowed through. They run against
    # a cloned registry in the C++ planner and have no path to the dispatcher.
    # Assistant. POST allowed; longer timeout for the tool-use loop.
    location /api/chat {
        limit_except GET HEAD OPTIONS POST { deny all; }
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
    }

    location /api/scenario {
        limit_except GET HEAD OPTIONS POST { deny all; }
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
    }

    # API reference: Swagger at /docs, ReDoc at /redoc, spec at /openapi.json.
    # These live outside /api/, so without naming them the `location /` above
    # answers with index.html and the docs link silently serves the dashboard.
    # GET only -- the viewers are read-only pages and the spec is generated.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://api:8000;
    }

    # Server-sent events: no buffering, long timeout.
    location /api/stream {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
